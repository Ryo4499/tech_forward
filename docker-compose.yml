services:
  db:
    image: mariadb:10.11
    volumes:
      - dbData:/var/lib/mysql
    environment:
      MARIADB_DATABASE: ${DB_NAME:-techforward}
      MARIADB_USER: ${DB_USER:-techforward}
      MARIADB_PASSWORD_FILE: /run/secrets/DB_PASS
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    secrets:
      - DB_PASS
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [db_net]

  memcached:
    image: memcached:1.6-alpine
    networks: [db_net]

  api:
    build: ./api
    command: ["gunicorn", "--workers", "1", "--bind", "0.0.0.0:5000", "run:app"]
    environment:
      DB_HOST: db:3306
      DB_NAME: ${DB_NAME:-techforward}
      DB_USER: ${DB_USER:-techforward}
      DB_PASS_FILE: /run/secrets/DB_PASS
    secrets:
      - DB_PASS
    depends_on:
      db:
        condition: service_healthy
    networks: [app_net, db_net]

  front:
    build: ./front
    command: ["yarn", "start"]
    environment:
      API_URL: http://api:5000/api
    depends_on: [api]
    networks: [app_net]

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    depends_on: [api, front]
    networks: [app_net]

volumes:
  dbData:

networks:
  app_net:
  db_net:
    internal: true

secrets:
  DB_PASS:
    file: ${DB_PASS_FILE:-./.secrets/db_pass.txt}
